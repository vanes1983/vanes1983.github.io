<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Editorial Gallery Layout</title>
    <style>
        :root {
            --bg-color: #f4f4f2; /* Теплый бумажный оттенок */
            --border-color: #e0e0de;
            --accent-color: #ff9d00;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #dcdcdc; /* Фон за пределами холста */
            font-family: 'Inter', sans-serif;
        }

        /* Основной контейнер с жесткими размерами */
        .canvas {
            width: 1280px;
            height: 720px;
            background-color: var(--bg-color);
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr 1.1fr;
            grid-template-rows: 1fr 1.3fr;
            gap: 15px;
            grid-template-areas: 
                "top-left center-tall right-tall"
                "bottom-left center-bottom right-tall";
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            background-color: #eee;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }

        .grid-item:hover img {
            transform: scale(1.05);
        }

        /* Назначение областей */
        .item-1 { grid-area: top-left; }
        .item-2 { grid-area: bottom-left; }
        .item-3 { grid-area: center-tall; }
        .item-4 { grid-area: center-bottom; }
        .item-5 { grid-area: right-tall; }

        /* Декоративные акценты */
        .canvas::after {
            content: "COLLECTION 2026 / VOL. 7";
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            letter-spacing: 2px;
            color: #999;
        }

        /* Рамка вокруг всей сетки для эффекта паспарту */
        .border-wrap {
            position: relative;
            padding: 10px;
            background: white;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="border-wrap">
        <div class="canvas">
            
            <div class="grid-item item-1">
                <img src="https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?auto=format&fit=crop&q=80&w=600" alt="Group laughing">
            </div>

            <div class="grid-item item-2">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&q=80&w=600" alt="Sitting in orange">
            </div>

            <div class="grid-item item-3">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=600" alt="Portrait central">
            </div>

            <div class="grid-item item-4">
                <img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&q=80&w=600" alt="Close up fashion">
            </div>

            <div class="grid-item item-5">
                <img src="https://images.unsplash.com/photo-1524250502761-1ac6f2e30d43?auto=format&fit=crop&q=80&w=700" alt="Full height group">
            </div>

        </div>
    </div>

</body>
</html>
